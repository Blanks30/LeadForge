services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadforge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - USE_MOCK_APIS=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:80","http://localhost","http://127.0.0.1:5173"]
    volumes:
      # Persistent volume mount for SQLite database across container recreations
      - leadforge_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leadforge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  leadforge_data:
    name: leadforge_sqlite_data
